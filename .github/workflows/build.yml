name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Import smoke test
        run: |
          python -c "from lamcp.server import mcp, run_python_script, bridge_health, unload_python_modules"

  build-ghpython-component:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install componentizer deps
        # The action's `componentize_cpy.py` does `import clr` (Python.NET)
        # but doesn't install pythonnet itself, so we pre-install it here.
        run: pip install pythonnet
      - name: Build Lamcp_Bridge.ghuser
        # `target` must be a single-segment path: the action uses `os.mkdir`
        # (not `makedirs`), so nested paths like `dist/ghuser/` fail because
        # the parent doesn't exist yet.
        uses: compas-dev/compas-actions.ghpython_components@v5
        with:
          source: grasshopper
          target: dist
          interpreter: cpython
      - uses: actions/upload-artifact@v5
        with:
          name: Lamcp_Bridge-ghuser
          path: dist/*.ghuser
          if-no-files-found: error

  build-rhino-plugin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Lamcp.rhp and yak package
        shell: pwsh
        run: |
          $version = python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          dotnet build rhino/plugin/Lamcp.csproj -c Release -p:Version=$version
          New-Item -ItemType Directory -Force yakdist | Out-Null
          Copy-Item rhino/plugin/bin/Release/net48/Lamcp.rhp yakdist/
          (Get-Content rhino/plugin/manifest.yml) -replace '^version: .*', "version: $version" |
            Set-Content -Encoding utf8NoBOM yakdist/manifest.yml
          Invoke-WebRequest https://files.mcneel.com/yak/tools/latest/yak.exe -OutFile yak.exe
          Push-Location yakdist; ..\yak.exe build --platform win; Pop-Location
      - uses: actions/upload-artifact@v5
        with:
          name: lamcp-rhino-plugin
          path: |
            yakdist/*.yak
            yakdist/*.rhp
          if-no-files-found: error
