name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v5
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  build-ghpython-component:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install componentizer deps
        # The action's `componentize_cpy.py` does `import clr` (Python.NET)
        # but doesn't install pythonnet itself, so we pre-install it here.
        run: pip install pythonnet
      - name: Build Lamcp_Bridge.ghuser
        # `target` must be a single-segment path: the action uses `os.mkdir`
        # (not `makedirs`), so nested paths like `dist/ghuser/` fail because
        # the parent doesn't exist yet.
        uses: compas-dev/compas-actions.ghpython_components@v5
        with:
          source: grasshopper
          target: dist
          interpreter: cpython
      - uses: actions/upload-artifact@v5
        with:
          name: ghpython-dist
          path: dist/*.ghuser
          if-no-files-found: error

  build-rhino-plugin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Lamcp.rhp and yak package
        shell: pwsh
        run: |
          $version = python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          dotnet build rhino/plugin/Lamcp.csproj -c Release -p:Version=$version
          New-Item -ItemType Directory -Force yakdist | Out-Null
          Copy-Item rhino/plugin/bin/Release/net48/Lamcp.rhp yakdist/
          (Get-Content rhino/plugin/manifest.yml) -replace '^version: .*', "version: $version" |
            Set-Content -Encoding utf8NoBOM yakdist/manifest.yml
          Invoke-WebRequest https://files.mcneel.com/yak/tools/latest/yak.exe -OutFile yak.exe
          Push-Location yakdist; ..\yak.exe build --platform win; Pop-Location
      - name: Publish to the Rhino package server
        # Runs only on tag pushes and when a YAK_TOKEN secret is configured
        # (see RELEASING.md). Without it, the .yak is still attached to the release.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          YAK_TOKEN: ${{ secrets.YAK_TOKEN }}
        run: |
          if (-not $env:YAK_TOKEN) { Write-Host "YAK_TOKEN not set, skipping yak push"; exit 0 }
          Get-ChildItem yakdist/*.yak | ForEach-Object { .\yak.exe push $_.FullName }
      - uses: actions/upload-artifact@v5
        with:
          name: rhino-plugin-dist
          path: yakdist/*.yak
          if-no-files-found: error

  publish-pypi:
    # Only publish on actual tag pushes, not on workflow_dispatch.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-python
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lamcp
    permissions:
      id-token: write   # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: python-dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-python, build-ghpython-component, build-rhino-plugin, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          name: python-dist
          path: dist/
      - uses: actions/download-artifact@v5
        with:
          name: ghpython-dist
          path: dist/
      - uses: actions/download-artifact@v5
        with:
          name: rhino-plugin-dist
          path: dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.ghuser
            dist/*.yak
            rhino/lamcp_bridge.py
          generate_release_notes: true
          body: |
            Install the Python MCP server: `pip install lamcp==${{ github.ref_name }}` (drop the leading `v`).

            For Rhino 8 / Grasshopper users: download `Lamcp_Bridge.ghuser` below and drop it into your Grasshopper Libraries folder
            (Grasshopper menu → File → Special Folders → Components Folder).
